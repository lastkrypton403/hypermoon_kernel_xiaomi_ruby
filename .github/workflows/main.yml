name: NetHunter Cloud Kernel Compiler

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses-dev bison flex libssl-dev libelf-dev bc \
        libncurses5-dev libssl-dev rsync kmod cpio dwarves fakeroot kernel-package

    - name: Configure Kernel Baseline
      run: |
        # Step 1: Generate your default system configuration base
        make defconfig

    - name: Inject NetHunter Configuration
      run: |
        # Step 2: Force-append mandatory NetHunter variables to the .config file
        cat <<EOT >> .config
        # NetHunter Core Drivers
        CONFIG_USB_ACM=y
        CONFIG_USB_F_HID=y
        CONFIG_USB_G_HID=y
        
        # Mac80211 & Wireless injection requirements
        CONFIG_WIRELESS=y
        CONFIG_CFG80211=m
        CONFIG_MAC80211=m
        CONFIG_MAC80211_LEDS=y
        CONFIG_NETFILTER=y
        
        # External Bluetooth & SDR Support
        CONFIG_BT=m
        CONFIG_BT_RFCOMM=m
        CONFIG_BT_HIDP=m
        CONFIG_BT_HCIBTUSB=m
        EOT
        
        # Step 3: Validate the configurations
        make olddefconfig

    - name: Compile patched Kernel
      run: |
        export KDEB_SOURCENAME="linux-hypermoon"
        
        # Compile using all available CPU cores. 
        # If compilation fails, this outputs the raw error without hiding behind dpkg rules
        make -j$(nproc) bindeb-pkg || (echo "Compilation failed! Checking logs..." && exit 1)

    - name: Upload NetHunter Kernel Packages
      uses: actions/upload-artifact@v4
      with:
        name: nethunter-debian-packages
        path: ../*.deb
